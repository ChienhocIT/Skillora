services:
  mysql:
    image: mysql:8.4
    container_name: ${SKILLORA_CONTAINER_PREFIX:-skillora}-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-Skillora}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-skillora-root-password}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - skillora_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-skillora-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ${SKILLORA_CONTAINER_PREFIX:-skillora}-redis
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - skillora_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    container_name: ${SKILLORA_CONTAINER_PREFIX:-skillora}-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-Skillora}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-skillora-root-password}
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      JWT_ISSUER: ${JWT_ISSUER:-skillora-platform}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:3000/reset-password?token={token}}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
      PAYMENT_RESULT_URL: ${PAYMENT_RESULT_URL:-http://localhost:3000/payment/result}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BUNNY_LIBRARY_ID: ${BUNNY_LIBRARY_ID:-}
      BUNNY_API_KEY: ${BUNNY_API_KEY:-}
      BUNNY_TUS_ENDPOINT: ${BUNNY_TUS_ENDPOINT:-https://video.bunnycdn.com/tusupload}
      BUNNY_UPLOAD_EXPIRATION: ${BUNNY_UPLOAD_EXPIRATION:-PT24H}
      BUNNY_WEBHOOK_SIGNING_SECRET: ${BUNNY_WEBHOOK_SIGNING_SECRET:-}
      BUNNY_TOKEN_SECURITY_KEY: ${BUNNY_TOKEN_SECURITY_KEY:-}
      BUNNY_SIGNED_PLAYBACK_ENABLED: ${BUNNY_SIGNED_PLAYBACK_ENABLED:-true}
      BUNNY_EMBED_TOKEN_TTL: ${BUNNY_EMBED_TOKEN_TTL:-PT2H}
      BUNNY_PULL_ZONE_HOST: ${BUNNY_PULL_ZONE_HOST:-}
      BUNNY_ALLOWED_MIME_TYPES: ${BUNNY_ALLOWED_MIME_TYPES:-video/mp4,video/webm,video/quicktime}
      BUNNY_MAX_FILE_SIZE_BYTES: ${BUNNY_MAX_FILE_SIZE_BYTES:-5368709120}
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-true}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  skillora_mysql:
  skillora_redis:
