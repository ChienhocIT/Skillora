name: ${SKILLORA_DOCKER_PROJECT:-skillora-local}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: Skillora
      MYSQL_USER: skillora
      MYSQL_PASSWORD: ${SKILLORA_DB_PASSWORD:-local-skillora-db}
      MYSQL_ROOT_PASSWORD: ${SKILLORA_DB_ROOT_PASSWORD:-local-skillora-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    mem_limit: 128m

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${SKILLORA_MAIL_PORT:-18025}:8025"
    restart: unless-stopped
    mem_limit: 128m

  app:
    image: skillora/platform:${SKILLORA_IMAGE_TAG:-local}
    build:
      context: ./skillora_platform
      args:
        BUILD_REVISION: ${SKILLORA_BUILD_REVISION:-working-tree}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: Skillora
      DB_USERNAME: skillora
      DB_PASSWORD: ${SKILLORA_DB_PASSWORD:-local-skillora-db}
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_HEALTH_ENABLED: "true"
      JWT_SECRET: ${SKILLORA_JWT_SECRET:-skillora-local-docker-secret-at-least-32-bytes}
      FRONTEND_URL: http://localhost:${SKILLORA_HTTP_PORT:-18080}
      PUBLIC_API_BASE_URL: http://localhost:${SKILLORA_HTTP_PORT:-18080}
      PAYMENT_RESULT_URL: http://localhost:${SKILLORA_HTTP_PORT:-18080}/payment/result
      PASSWORD_RESET_URL: http://localhost:${SKILLORA_HTTP_PORT:-18080}/reset-password?token={token}
      PAYMENT_ENABLED: "false"
      GEMINI_API_KEY: ""
      BUNNY_API_KEY: ""
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SMTP_AUTH: "false"
      MAIL_SMTP_STARTTLS_ENABLE: "false"
      MAIL_HEALTH_ENABLED: "true"
      SKILLORA_SEED_ENABLED: "true"
      SKILLORA_SEED_PASSWORD: ${SKILLORA_SEED_PASSWORD:-Skillora@12345}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
      LOGGING_LEVEL_COM_EXAMPLE_SKILLORA_PLATFORM: INFO
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
      SPRING_JPA_SHOW_SQL: "false"
      RATE_LIMIT_AUTH: "300"
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 30s

  frontend:
    image: skillora/web:${SKILLORA_IMAGE_TAG:-local}
    build:
      context: ./skillora_web
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:${SKILLORA_HTTP_PORT:-18080}
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${SKILLORA_HTTP_PORT:-18080}
        BUILD_REVISION: ${SKILLORA_BUILD_REVISION:-working-tree}
    depends_on:
      app:
        condition: service_healthy
    environment:
      API_BASE_URL: http://app:8080
      PUBLIC_API_BASE_URL: http://localhost:${SKILLORA_HTTP_PORT:-18080}
      OAUTH_GOOGLE_ENABLED: "false"
    restart: unless-stopped
    mem_limit: 512m

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${SKILLORA_HTTP_PORT:-18080}:80"
    volumes:
      - ./docker/nginx.local.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    mem_limit: 64m

volumes:
  mysql-data:
  redis-data:
